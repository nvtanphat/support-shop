[project]
name = "shop-support-agent"
version = "1.0.0"
description = "AI Customer Support Agent for E-Commerce: Policy Q&A, Order Tracking, and Supervised Returns/Refunds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "langgraph>=0.2.50",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.25",
    "langchain-google-genai>=2.0.7",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.2.1",
    "pyjwt[crypto]>=2.10.1",
    "argon2-cffi>=23.1.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
]

[project.optional-dependencies]
rerank = [
    "fastembed>=0.5.0",
]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.122.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12.20241230",
    "poethepoet>=0.32.0",
    "aiosqlite>=0.22.1",
]
local-embeddings = [
    "sentence-transformers>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.122.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12.20241230",
    "poethepoet>=0.32.0",
    "aiosqlite>=0.22.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/shopagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "shopagent.domain.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "shopagent.agent.tools.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "."]

[tool.poe.tasks]
test = "pytest backend/tests"
test-unit = "pytest backend/tests/unit"
test-int = "pytest backend/tests/integration"
test-eval = "python -m shopagent.cli eval run --mode offline"
lint = "ruff check backend/src backend/tests"
format = "ruff format backend/src backend/tests"
typecheck = "mypy backend/src/shopagent"
seed = "python -m shopagent.cli seed"
verify-data = "python -m shopagent.cli verify-data"
api = "uvicorn shopagent.api.main:app --reload --host 0.0.0.0 --port 8000"
worker = "python -m shopagent.worker"
