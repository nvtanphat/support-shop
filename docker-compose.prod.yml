services:
  caddy:
    image: caddy:2-alpine
    container_name: shopagent-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend/dist:/srv/app
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg17
    container_name: shopagent-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopagent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopagent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/shop-support-agent/backend:latest
    container_name: shopagent-api-prod
    command: uvicorn shopagent.api.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopagent}
      - DATABASE_URL_SYNC=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopagent}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ghcr.io/shop-support-agent/backend:latest
    container_name: shopagent-worker-prod
    command: python -m shopagent.worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopagent}
      - DATABASE_URL_SYNC=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopagent}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:
