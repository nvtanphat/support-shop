roles:
  agent_primary:
    provider: "${LLM_PRIMARY_PROVIDER}"
    model: "${LLM_PRIMARY_MODEL}"
    temperature: 0.0
    timeout_s: 30
  agent_fallback:
    provider: "${LLM_FALLBACK_PROVIDER}"
    model: "${LLM_FALLBACK_MODEL}"
    temperature: 0.0
    timeout_s: 30
  summarizer:
    provider: "${LLM_CHEAP_PROVIDER}"
    model: "${LLM_CHEAP_MODEL}"
    temperature: 0.0
  user_simulator:
    provider: "${LLM_SIM_PROVIDER}"
    model: "${LLM_SIM_MODEL}"
    temperature: 0.7

budgets:
  max_agent_iterations: 6
  max_input_tokens_per_turn: 12000
  turn_timeout_s: 90
  tool_timeout_s: 12
  synthesis_timeout_s: 20
  max_cost_usd_per_conversation: 0.10
  daily_cost_usd_kill_switch: 2.00
