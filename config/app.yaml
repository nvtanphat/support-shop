app_name: "ShopLab"
store_name: "ShopLab"
timezone: "Asia/Ho_Chi_Minh"
locale: "vi_VN"

business_hours:
  days: [1, 2, 3, 4, 5, 6]  # Thứ 2 đến Thứ 7
  start_hour: 8
  start_minute: 30
  end_hour: 21
  end_minute: 0
  sla_off_hours_reply: "8:30 sáng ngày làm việc tiếp theo"

retention_days:
  conversation_days: 180
  evidence_days: 90
  audit_log_days: 365

rate_limits:
  messages_per_minute_user: 20
  guest_otp_requests_window_minutes: 15
  guest_otp_requests_max_per_ip: 5
  guest_otp_requests_max_per_order: 3
  guest_otp_max_failed_attempts: 5

pending_action_ttl_minutes: 30
guest_view_token_ttl_minutes: 30

allowed_link_domains:
  - "shoplab.test"
  - "sandbox.vnpayment.vn"
  - "mailpit.local"

# Cross-encoder reranking of policy lookups, with an unsupported-question threshold.
# Needs the `rerank` extra and a ~570 MB model, and costs ~2 s per policy lookup on CPU. If it is enabled
# and cannot load, policy lookups fail loudly instead of falling back to the weaker ranking.
# min_score: below this best cross-encoder score the question is treated as outside the policy. It was
# calibrated on evals/retrieval/policy_queries_independent.yaml and then measured once on the untouched
# policy_queries_holdout.yaml (see docs/eval-report.md); recalibrate with `python -m evals.retrieval.holdout`
# whenever the model or the clause texts change. Tests turn the reranker off (RETRIEVAL_RERANKER_ENABLED=false).
retrieval:
  reranker:
    enabled: true
    model: "BAAI/bge-reranker-v2-m3-int8"
    candidates: 10
    min_score: -4.76
