version: "2026-11-01"
effective_from: "2026-11-01T00:00:00+07:00"
effective_to: null
timezone: "Asia/Ho_Chi_Minh"

return:
  windows_days:
    defect_like: 15          # defective, damaged_in_transit, wrong_item, missing_item, not_as_described
    change_of_mind: 7        # đổi ý không còn nhu cầu
  change_of_mind_excluded_flags:
    - final_sale
    - hygiene
    - sealed_cosmetic
    - personalized
  evidence:
    required_for:
      - defective
      - damaged_in_transit
      - wrong_item
      - missing_item
      - not_as_described
    min_photos: 2
    video_required_for:
      - missing_item
  return_shipping:
    shop_fault_reasons:
      - defective
      - damaged_in_transit
      - wrong_item
      - missing_item
      - not_as_described
    customer_fee_vnd: 30000
  ship_back_deadline_days: 5
  deadline_rule: "end_of_local_day"   # 23:59:59 ngày (ngày giao + N)

refund:
  auto_approve_max_vnd: 500000
  agent_approve_max_vnd: 2000000
  sla_working_days:
    ewallet: [1, 3]
    bank_transfer: [3, 5]
    card: [7, 15]

cancel:
  self_service_statuses:
    - pending_payment
    - confirmed
  needs_approval_statuses:
    - packing

exchange:
  same_product_only: true
  same_price_only: true
  max_times_per_item: 1

risk_flags:
  many_returns:
    count: 3
    window_days: 30
  high_return_rate:
    ratio: 0.5
    last_orders: 10
  new_account_high_value:
    account_age_days: 7
    order_total_vnd: 2000000

pending_action_ttl_minutes: 30

shipping:
  standard_delivery_days: [2, 5]
