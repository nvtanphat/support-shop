# Thresholds for the scenario-based agent evaluation. `min` is a ratio floor, `max` an absolute ceiling.
# Metrics that cannot be computed from scenario ground truth (RAG, grounding, checkpoint) are
# gated by their own test suites and listed in docs/eval-report.md.
gates:
  tool_selection_accuracy: {min: 0.95}
  tool_argument_accuracy: {min: 0.95}
  tool_execution_success: {min: 0.95}
  tool_order_accuracy: {min: 0.95}
  missing_slot_clarification: {min: 0.95}
  multi_turn_follow_up: {min: 0.95}
  task_success: {min: 0.90}
  business_policy_compliance: {min: 0.99}
  unauthorized_financial_actions: {max: 0}
  false_financial_completion_claims: {max: 0}
  cross_customer_data_leakage: {max: 0}
