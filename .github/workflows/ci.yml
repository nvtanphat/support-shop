name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check backend/src backend/tests evals

      - name: Run Mypy Type Checker
        run: mypy backend/src/shopagent

  backend:
    name: Backend Tests & PostgreSQL Integration
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: shopagent
          POSTGRES_PASSWORD: shopagent_password
          POSTGRES_DB: shopagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INTEGRATION_MODE: simulated
      DATABASE_URL: "postgresql+psycopg://shopagent:shopagent_password@localhost:5432/shopagent_test"
      DATABASE_URL_SYNC: "postgresql://shopagent:shopagent_password@localhost:5432/shopagent_test"
      PYTHONPATH: "backend/src:."
      LLM_PRIMARY_PROVIDER: fake
      LLM_FALLBACK_PROVIDER: fake
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Database Migrations (PostgreSQL)
        run: |
          alembic upgrade head

      - name: Seed test database & index policy
        run: |
          python -m shopagent.cli seed
          python -m shopagent.rag.indexer

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests/ -v
        env:
          DATABASE_TEST_URL: "sqlite+aiosqlite:///:memory:"
          # Enables the LangGraph AsyncPostgresSaver checkpoint tests against the service container.
          TEST_POSTGRES_URL: "postgresql://shopagent:shopagent_password@localhost:5432/shopagent_test"

      - name: Run Evaluation Harness (Oracle & Null Baselines)
        run: |
          # The Oracle must clear every quality gate; the Null agent must not (proves the gates can fail).
          python -m evals.harness.runner --agent oracle --gate
          if python -m evals.harness.runner --agent null --gate; then echo "Null agent passed the quality gates"; exit 1; fi

  frontend:
    name: Frontend Build, Unit & Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript Check & Vite Build
        run: cd frontend && npm run build

      - name: Run Vitest Unit Tests
        run: cd frontend && npm test

      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: cd frontend && npm run test:e2e
